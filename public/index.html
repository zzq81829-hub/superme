<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Founder OS</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">AI COMPANY · V1</div>
        <h1>AI Founder OS</h1>
        <p>你只负责说目标。系统负责拆解、派单、执行、汇报。</p>
      </div>
      <div id="health" class="status">连接中…</div>
    </header>

    <section class="panel hero">
      <h2>今天想让 AI 做什么？</h2>
      <input id="title" placeholder="例如：把书摘的小红书封面系统改得更高级" />
      <textarea id="description" rows="7" placeholder="把你的想法直接说出来，不需要写 PRD。"></textarea>
      <div class="row">
        <select id="agent">
          <option value="auto">自动分配</option>
          <option value="antigravity">Antigravity</option>
          <option value="codex">Codex</option>
        </select>
        <input id="projectPath" placeholder="项目路径，例如 D:\Projects\shuzhai" />
        <button id="create">创建并执行</button>
      </div>
    </section>

    <section class="panel">
      <div class="sectionHeader">
        <h2>任务队列</h2>
        <button class="ghost" id="refresh">刷新</button>
      </div>
      <div id="tasks" class="tasks"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
