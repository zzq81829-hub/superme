<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Founder OS</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">AI COMPANY</div>
        <h1>AI Founder OS</h1>
        <p>CEO：Hermes。你只说目标。系统派工、验证、回报。</p>
      </div>
      <div id="health" class="status">连接中…</div>
    </header>

    <section class="panel hero">
      <h2>今天想让 AI 做什么？</h2>
      <input id="title" placeholder="例如：把书摘的小红书封面系统改得更高级" />
      <textarea id="description" rows="7" placeholder="把你的想法直接说出来，不需要写 PRD。"></textarea>
      <textarea id="acceptance" rows="3" placeholder="可选机器验收，每行一条，例如：存在: output/report.md 或 运行: npm test"></textarea>
      <div class="row">
        <select id="agent">
          <option value="auto">自动分配</option>
          <option value="hermes">Hermes</option>
          <option value="codex">Codex</option>
          <option value="claude">Claude Code</option>
          <option value="antigravity">Antigravity</option>
          <option value="grok-build">Grok Build</option>
          <option value="grok">Grok</option>
          <option value="deepseek">DeepSeek</option>
          <option value="grok-bot">Grok Bot (实验)</option>
        </select>
        <input id="projectPath" placeholder="项目路径，例如 D:\Projects\shuzhai" />
        <button id="create">创建并执行</button>
      </div>
    </section>

    <section class="panel">
      <div class="sectionHeader">
        <h2>Workers</h2>
      </div>
      <div id="workers" class="meta">加载中…</div>
    </section>

    <section class="panel">
      <div class="sectionHeader">
        <h2>任务队列</h2>
        <button class="ghost" id="refresh">刷新</button>
      </div>
      <div id="tasks" class="tasks"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
